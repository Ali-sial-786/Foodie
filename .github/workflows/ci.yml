name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Shared module tests (nutrition engine, AI contracts, parsers)
        run: ./gradlew :shared:jvmTest --console=plain

      - name: Android unit + Robolectric + Compose UI tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Room schema is committed
        # Exported schemas are needed to write and test migrations. Until the first one is
        # committed this only prints it; afterwards any uncommitted change fails the build.
        run: |
          if [ -z "$(git ls-files app/schemas)" ]; then
            echo "::warning::No Room schema committed yet; copy the JSON below into app/schemas/"
            find app/schemas -name '*.json' -print -exec cat {} \;
          elif [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::The Room schema changed. Bump the database version, add a migration and commit app/schemas/."
            git status --porcelain app/schemas
            exit 1
          fi

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Benchmark (mock provider, deterministic)
        run: ./gradlew :shared:jvmTest --tests "*BenchmarkTest*" --console=plain --rerun

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            shared/build/reports/benchmark/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nouri-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
