name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOURI_BUILD_NUMBER: ${{ github.run_number }}
      HAS_DEBUG_KEYSTORE: ${{ secrets.NOURI_DEBUG_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v5

      # Android only installs a new APK over the old one if both are signed with the same
      # key, and every runner would otherwise make a new debug key. Keep one: from the
      # NOURI_DEBUG_KEYSTORE secret (a base64 keystore) if set, else in the Actions cache.
      - name: Debug signing key from the repository secret
        if: env.HAS_DEBUG_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.NOURI_DEBUG_KEYSTORE }}
        run: mkdir -p ~/.android && printf '%s' "$KEYSTORE" | base64 --decode > ~/.android/debug.keystore

      - name: Debug signing key from the cache
        if: env.HAS_DEBUG_KEYSTORE != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nouri-debug-keystore-v1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Create the debug signing key (first build only)
        run: |
          if [ ! -s ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "NOURI_DEBUG_KEYSTORE_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Shared module tests (nutrition engine, AI contracts, parsers)
        run: ./gradlew :shared:jvmTest --console=plain

      - name: Generated data is up to date
        run: |
          python3 scripts/generate_food_data.py --check
          python3 scripts/build_recipe_library.py --check

      - name: Android unit + Robolectric + Compose UI tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Room schema is committed
        # Exported schemas are needed to write and test migrations (MigrationTest builds a v1
        # database from 1.json). Changing a committed schema fails the build; a new version
        # after a bump is printed so it can be committed.
        run: |
          if [ ! -d app/schemas ]; then
            # Code generation was restored from the build cache, so no schema was written this run.
            echo "::notice::Room schema not regenerated in this run (build cache hit)"
          elif [ -z "$(git ls-files app/schemas)" ]; then
            echo "::warning::No Room schema committed yet; copy the JSON below into app/schemas/"
            find app/schemas -name '*.json' -print -exec cat {} \;
          elif [ -n "$(git status --porcelain app/schemas | grep -v '^??')" ]; then
            echo "::error::A committed Room schema changed. Bump the database version, add a migration and commit app/schemas/."
            git status --porcelain app/schemas
            exit 1
          elif [ -n "$(git status --porcelain app/schemas)" ]; then
            # A new version after a bump: fine, but it must be committed so later changes are caught.
            echo "::warning::New Room schema version not committed yet; copy the JSON below into app/schemas/"
            git status --porcelain app/schemas | sed 's/^?? //' | while read -r f; do find "$f" -name '*.json' -print -exec cat {} \; ; done
          fi

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: APK signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -E "SHA-256|DN"
          "$AAPT2" dump badging app/build/outputs/apk/debug/*.apk | head -1

      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Benchmark (mock provider, deterministic)
        run: ./gradlew :shared:jvmTest --tests "*BenchmarkTest*" --console=plain --rerun

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            shared/build/reports/benchmark/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nouri-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
