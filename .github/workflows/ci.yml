name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Shared module tests (nutrition engine, AI contracts, parsers)
        run: ./gradlew :shared:jvmTest --console=plain

      - name: Generated data is up to date
        run: |
          python3 scripts/generate_food_data.py --check
          python3 scripts/build_recipe_library.py --check

      - name: Android unit + Robolectric + Compose UI tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Room schema is committed
        # Exported schemas are needed to write and test migrations (MigrationTest builds a v1
        # database from 1.json). Changing a committed schema fails the build; a new version
        # after a bump is printed so it can be committed.
        run: |
          if [ ! -d app/schemas ]; then
            # Code generation was restored from the build cache, so no schema was written this run.
            echo "::notice::Room schema not regenerated in this run (build cache hit)"
          elif [ -z "$(git ls-files app/schemas)" ]; then
            echo "::warning::No Room schema committed yet; copy the JSON below into app/schemas/"
            find app/schemas -name '*.json' -print -exec cat {} \;
          elif [ -n "$(git status --porcelain app/schemas | grep -v '^??')" ]; then
            echo "::error::A committed Room schema changed. Bump the database version, add a migration and commit app/schemas/."
            git status --porcelain app/schemas
            exit 1
          elif [ -n "$(git status --porcelain app/schemas)" ]; then
            # A new version after a bump: fine, but it must be committed so later changes are caught.
            echo "::warning::New Room schema version not committed yet; copy the JSON below into app/schemas/"
            git status --porcelain app/schemas | sed 's/^?? //' | while read -r f; do find "$f" -name '*.json' -print -exec cat {} \; ; done
          fi

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Benchmark (mock provider, deterministic)
        run: ./gradlew :shared:jvmTest --tests "*BenchmarkTest*" --console=plain --rerun

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            shared/build/reports/benchmark/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nouri-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
