name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Shared module tests (nutrition engine, AI contracts, parsers)
        run: ./gradlew :shared:jvmTest --stacktrace --console=plain

      - name: Android unit + Robolectric + Compose UI tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Benchmark (mock provider, deterministic)
        run: ./gradlew :shared:jvmTest --tests "*BenchmarkTest*" --console=plain --rerun

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            shared/build/reports/benchmark/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nouri-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
