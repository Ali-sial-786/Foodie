name: iOS

# Builds the shared Kotlin framework for iOS, runs the shared tests on the iOS
# simulator, builds and tests the SwiftUI app, and produces an unsigned .ipa.
on:
  push:
    branches: ['**']
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'data/recipes/**'
      - 'app/src/main/assets/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      NOURI_SKIP_ANDROID: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Shared tests on the iOS simulator (Kotlin/Native)
        run: ./gradlew :shared:iosSimulatorArm64Test --console=plain

      - name: Build the NouriShared XCFramework
        run: ./gradlew :shared:assembleNouriSharedReleaseXCFramework --console=plain

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "SIMULATOR=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build and test the app on the simulator
        run: |
          cd iosApp
          set -o pipefail
          xcodebuild -project Nouri.xcodeproj -scheme Nouri -configuration Debug \
            -destination "id=$SIMULATOR" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee xcodebuild-test.log | grep -E "error:|warning: .*Nouri/|Test Case|Executed|BUILD|\*\*" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild-test.log

      - name: Build an unsigned device app (.ipa)
        run: |
          cd iosApp
          set -o pipefail
          xcodebuild -project Nouri.xcodeproj -scheme Nouri -configuration Release -sdk iphoneos \
            -destination "generic/platform=iOS" -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee xcodebuild-device.log | grep -E "error:|BUILD|\*\*" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild-device.log
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/Nouri.app Payload/
          zip -qry Nouri-unsigned.ipa Payload
          ls -la Nouri-unsigned.ipa

      - name: Upload the unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nouri-ios-unsigned-ipa
          path: iosApp/Nouri-unsigned.ipa
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            iosApp/xcodebuild-*.log
            shared/build/reports/tests/
          retention-days: 14
