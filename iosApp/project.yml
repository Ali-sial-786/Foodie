# XcodeGen spec: `xcodegen generate` creates Nouri.xcodeproj (not committed).
# Build the shared Kotlin framework first: ./gradlew :shared:assembleNouriSharedReleaseXCFramework
name: Nouri
options:
  bundleIdPrefix: app.nouri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Nouri:
    type: application
    platform: iOS
    sources:
      - path: Nouri
      - path: ../app/src/main/assets/fooddb/usda_sr28.tsv
        buildPhase: resources
      - path: ../app/src/main/assets/recipes/library.json
        buildPhase: resources
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/NouriShared.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: Network.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nouri.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-lc++"]
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Nouri/Info.plist
      properties:
        CFBundleDisplayName: Nouri
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Nouri uses the camera to photograph meals and scan barcodes. A resized copy of a meal photo is sent only to the AI provider you choose, after you agree."
        NSPhotoLibraryUsageDescription: "Choose a meal photo to analyse. Only a resized copy without location data is sent, and only to the AI provider you choose."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  NouriTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NouriTests]
    dependencies:
      - target: Nouri
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nouri.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Nouri:
    build:
      targets:
        Nouri: all
        NouriTests: [test]
    test:
      targets: [NouriTests]
